services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"   # schema registry
      - "18082:18082"   # pandaproxy
      - "19092:19092"   # kafka (vanaf je host)
      - "9644:9644"     # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]

    command: >
      -c "
      for t in werkorder-notificaties werkorder-notificaties.dlq werkorder-events; do
        rpk topic describe $$t -X brokers=redpanda:9092 ||
        rpk topic create $$t -X brokers=redpanda:9092 -p 3;
      done
      "

  ws-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ws-microservice
    environment:
      - KAFKA_BROKER=redpanda:9092
      - KAFKA_TOPIC=werkorder-notificaties
      - PORT=8080
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped

  werkorder-api:
    build: ./werkorder-api
    container_name: werkorder-api
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_PATH: /data/werkorders.db          # SQLite (PoC); het volume houdt de data over herstarts heen
      KAFKA_BROKER: redpanda:9092           # de outbox-relay publiceert hiernaartoe
      # Schrijven mag alleen met een token van het service-account target-adapter (rol werkorder-schrijver).
      # Zet INTERN_API_KEY alleen als je lokaal zonder Keycloak wilt testen.
    volumes:
      - werkorder-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    expose:
      - "8081"

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - ws-microservice
      - werkorder-api
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    restart: unless-stopped
    # Keycloak kent geen NAAM_FILE. Daarom leest dit opstartscript de twee geheimen uit /run/secrets en zet ze alleen in de omgeving van
    # het Keycloak-proces zelf (niet in de containerdefinitie, dus niet in `docker inspect`). Het client-secret komt via ${...} in het
    # realm-bestand terecht (client target-adapter); het beheerwachtwoord is het bootstrap-wachtwoord van de admin-gebruiker.
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        export TARGET_ADAPTER_CLIENT_SECRET="$$(cat /run/secrets/target_adapter_client_secret)"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: ["start-dev", "--import-realm"]
    secrets:
      - keycloak_admin_password
      - target_adapter_client_secret
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin          # het beheerscherm is niet van buiten bereikbaar
      KC_HOSTNAME: http://localhost:8180          # de URL waarmee de BROWSER bij Keycloak komt (= "iss" in de tokens)
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"       # houdt het geheugengebruik laag
    healthcheck:                                  # poort open = realm is geïmporteerd (de import gebeurt vóór het luisteren)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ./keycloak/werkorders-realm.json:/opt/keycloak/data/import/werkorders-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"                      # alleen bereikbaar vanaf deze computer
    mem_limit: 1g

  # ---------------------------------------------------------------
  # Taakgerichte broker (Apache ActiveMQ Artemis): bron -> monteursysteem
  # Queue eam.workorder.v1 en Dead Letter Address staan in artemis/etc-override/broker.xml.
  # Console: http://localhost:8161 (alleen vanaf deze computer). Inloggegevens: zie .env.example.
  # ---------------------------------------------------------------
  # Zet vóór de eerste start de broker-configuratie en de gebruikers/rollen in het volume (etc-override). Artemis leest die map
  # alleen bij het AANMAKEN van de instance: na een wijziging dus `docker compose down -v` (zie artemis/README.md).
  # Wachtwoorden en het keystore-wachtwoord komen als bestand uit de kluis (secrets/, zie scripts/kluis.sh); de TLS-keystore uit
  # scripts/maak-certs.sh. Gebruikersnamen zijn geen geheim en blijven gewone instellingen.
  #   artemis      beheerder (console, rooktest)       rol amq
  #   source-adapter                                   rol eam-source: alleen versturen naar eam.workorder.v1
  #   target-adapter                                   rol eam-target: ontvangen van eam.workorder.v1, versturen naar de .dlq
  artemis-init:
    image: alpine:3.20
    container_name: artemis-init
    environment:
      ADMIN_USER: artemis
      ADMIN_PASSWORD_FILE: /run/secrets/artemis_admin_password
      SOURCE_USER: ${SOURCE_ADAPTER_BROKER_USER:-source-adapter}
      SOURCE_PASSWORD_FILE: /run/secrets/artemis_source_password
      TARGET_USER: ${TARGET_ADAPTER_BROKER_USER:-target-adapter}
      TARGET_PASSWORD_FILE: /run/secrets/artemis_target_password
      KEYSTORE_PASSWORD_FILE: /run/secrets/artemis_keystore_password
      TLS_KEYSTORE: /run/secrets/artemis_keystore
    secrets:
      - artemis_admin_password
      - artemis_source_password
      - artemis_target_password
      - artemis_keystore_password
      - artemis_keystore
    volumes:
      - artemis-data:/inst
      - ./artemis/etc-override/broker.xml:/src/broker.xml:ro
      - ./artemis/init-users.sh:/init-users.sh:ro
    entrypoint: ["/bin/sh", "/init-users.sh"]

  artemis:
    image: apache/artemis:2.57.0
    container_name: artemis
    restart: unless-stopped
    depends_on:
      artemis-init:
        condition: service_completed_successfully
    environment:
      # De image maakt bij het aanmaken van de instance één gebruiker uit deze twee variabelen. Die gebruiker bestaat daarna niet meer:
      # artemis-users.properties uit etc-override (artemis-init, met de wachtwoorden uit de kluis) vervangt het bestand. Daarom is dit
      # een bewust waardeloze opstartgebruiker en geen echt wachtwoord; de rooktest controleert dat hij niet kan inloggen.
      ARTEMIS_USER: bootstrap
      ARTEMIS_PASSWORD: bootstrap
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --java-memory 512M"   # standaardwaarde plus een kleinere heap
    volumes:
      - artemis-data:/var/lib/artemis-instance
    ports:
      - "127.0.0.1:61616:61616"    # CORE en AMQP 1.0, alleen via TLS
      - "127.0.0.1:8161:8161"      # webconsole
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

  # ---------------------------------------------------------------
  # Source-adapter (connector-in): valideert het bronbericht, vertaalt naar het canonieke EAM-model en zet het
  # persistent op de queue eam.workorder.v1. Bouwcontext is de repo-root, omdat hij de schema's uit contracts/ nodig heeft.
  # ---------------------------------------------------------------
  source-adapter:
    build:
      context: .
      dockerfile: source-adapter/Dockerfile
    container_name: source-adapter
    restart: unless-stopped
    environment:
      PORT: 8090
      BROKER_HOST: artemis
      BROKER_PORT: 61616
      BROKER_QUEUE: eam.workorder.v1
      BROKER_USER: ${SOURCE_ADAPTER_BROKER_USER:-source-adapter}
      BROKER_PASSWORD_FILE: /run/secrets/artemis_source_password
      BROKER_TLS_CA: /run/secrets/broker_ca            # de adapter vertrouwt alleen deze CA en controleert de hostnaam (artemis)
    secrets:
      - artemis_source_password
      - broker_ca
    depends_on:
      artemis:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Target-adapter (connector-out): queue eam.workorder.v1 -> valideren -> monteur-model -> PUT werkorder-api
  # ---------------------------------------------------------------
  target-adapter:
    build:
      context: .
      dockerfile: target-adapter/Dockerfile
    container_name: target-adapter
    restart: unless-stopped
    environment:
      PORT: 8091
      BROKER_HOST: artemis
      BROKER_PORT: 61616
      BROKER_QUEUE: eam.workorder.v1
      BROKER_DLQ: eam.workorder.v1.dlq
      BROKER_USER: ${TARGET_ADAPTER_BROKER_USER:-target-adapter}
      BROKER_PASSWORD_FILE: /run/secrets/artemis_target_password
      BROKER_TLS_CA: /run/secrets/broker_ca
      API_URL: http://werkorder-api:8081
      # Inloggen als service-account (client credentials). Het token bevat de rol die /intern vraagt.
      OIDC_TOKEN_URL: http://keycloak:8080/realms/werkorders/protocol/openid-connect/token
      OIDC_CLIENT_ID: target-adapter
      OIDC_CLIENT_SECRET_FILE: /run/secrets/target_adapter_client_secret
    secrets:
      - artemis_target_password
      - target_adapter_client_secret
      - broker_ca
    depends_on:
      artemis:
        condition: service_healthy
      werkorder-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Bronapp (OMS-simulator): vervangt producer.js. Zie bron-app/server.js en contracts/bron/.
  # Bedien hem met curl op http://localhost:8095. Met een lege ADAPTER_URL in .env draait hij droog.
  # ---------------------------------------------------------------
  bron-app:
    build: ./bron-app
    container_name: bron-app
    restart: unless-stopped
    environment:
      PORT: 8095
      ADAPTER_URL: ${ADAPTER_URL-http://source-adapter:8090/werkopdracht}      # alleen leeg als je dat in .env zo zet (dan draait hij droog)
      AUTO_INTERVAL_MS: ${BRON_AUTO_INTERVAL_MS:-0}
    depends_on:
      - source-adapter
    ports:
      - "127.0.0.1:8095:8095"
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Lokale kluis (HashiCorp Vault) voor de wachtwoorden. Alleen met het profiel "kluis" en alleen via scripts/kluis.sh; de rest van de
  # omgeving draait ook zonder dat deze service aan staat (de geheimen staan dan als bestand onder secrets/).
  # Opslag op een volume; de kluis start verzegeld en wordt door ./scripts/kluis.sh ontgrendeld. Alleen bereikbaar vanaf deze computer.
  # ---------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    profiles: ["kluis"]
    restart: unless-stopped
    command: ["server"]
    environment:
      VAULT_LOCAL_CONFIG: '{"storage":{"file":{"path":"/vault/file"}},"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}}],"ui":true,"disable_mlock":true}'
    volumes:
      - vault-data:/vault/file
    ports:
      - "127.0.0.1:8200:8200"
    mem_limit: 256m

# Docker-secrets uit bestanden: de bestanden maakt scripts/kluis.sh (geheimen uit Vault) en scripts/maak-certs.sh (TLS). Ze verschijnen in
# de containers onder /run/secrets/<naam>. Ontbreekt er een, dan weigert `docker compose up`; draai dan eerst ./scripts/kluis.sh klaarzetten.
secrets:
  artemis_admin_password:
    file: ./secrets/artemis_admin_password
  artemis_source_password:
    file: ./secrets/artemis_source_password
  artemis_target_password:
    file: ./secrets/artemis_target_password
  artemis_keystore_password:
    file: ./secrets/artemis_keystore_password
  artemis_keystore:
    file: ./secrets/tls/broker.p12
  broker_ca:
    file: ./secrets/tls/ca.pem
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  target_adapter_client_secret:
    file: ./secrets/target_adapter_client_secret

volumes:
  vault-data:
  redpanda-data:
  artemis-data:
  werkorder-data:

