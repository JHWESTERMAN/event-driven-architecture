services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"   # schema registry
      - "18082:18082"   # pandaproxy
      - "19092:19092"   # kafka (vanaf je host)
      - "9644:9644"     # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]

    command: >
      -c "
      for t in werkorder-notificaties werkorder-notificaties.dlq werkorder-events; do
        rpk topic describe $$t -X brokers=redpanda:9092 ||
        rpk topic create $$t -X brokers=redpanda:9092 -p 3;
      done
      "

  ws-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ws-microservice
    environment:
      - KAFKA_BROKER=redpanda:9092
      - KAFKA_TOPIC=werkorder-notificaties
      - PORT=8080
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped

  werkorder-api:
    build: ./werkorder-api
    container_name: werkorder-api
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_PATH: /data/werkorders.db          # SQLite (PoC); het volume houdt de data over herstarts heen
      KAFKA_BROKER: redpanda:9092           # de outbox-relay publiceert hiernaartoe
      INTERN_API_KEY: ${INTERN_API_KEY:-dev-intern-sleutel}   # alleen PoC; zie .env.example
    volumes:
      - werkorder-data:/data
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    expose:
      - "8081"

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - ws-microservice
      - werkorder-api
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin          # alleen lokaal; het beheerscherm is niet van buiten bereikbaar
      KC_HOSTNAME: http://localhost:8180          # de URL waarmee de BROWSER bij Keycloak komt (= "iss" in de tokens)
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"       # houdt het geheugengebruik laag
    volumes:
      - ./keycloak/werkorders-realm.json:/opt/keycloak/data/import/werkorders-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"                      # alleen bereikbaar vanaf deze computer
    mem_limit: 1g

  # ---------------------------------------------------------------
  # Taakgerichte broker (Apache ActiveMQ Artemis): bron -> monteursysteem
  # Queue eam.workorder.v1 en Dead Letter Address staan in artemis/etc-override/broker.xml.
  # Console: http://localhost:8161 (alleen vanaf deze computer). Inloggegevens: zie .env.example.
  # ---------------------------------------------------------------
  artemis:
    image: apache/artemis:2.57.0
    container_name: artemis
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}      # alleen lokaal; in k8s komt dit uit een Secret
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --java-memory 512M"   # standaardwaarde plus een kleinere heap
    volumes:
      - artemis-data:/var/lib/artemis-instance
      - ./artemis/etc-override:/var/lib/artemis-instance/etc-override:ro
    ports:
      - "127.0.0.1:61616:61616"    # CORE en AMQP 1.0
      - "127.0.0.1:8161:8161"      # webconsole
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

  # ---------------------------------------------------------------
  # Source-adapter (connector-in): valideert het bronbericht, vertaalt naar het canonieke EAM-model en zet het
  # persistent op de queue eam.workorder.v1. Bouwcontext is de repo-root, omdat hij de schema's uit contracts/ nodig heeft.
  # ---------------------------------------------------------------
  source-adapter:
    build:
      context: .
      dockerfile: source-adapter/Dockerfile
    container_name: source-adapter
    restart: unless-stopped
    environment:
      PORT: 8090
      BROKER_HOST: artemis
      BROKER_PORT: 61616
      BROKER_QUEUE: eam.workorder.v1
      BROKER_USER: ${ARTEMIS_USER:-artemis}
      BROKER_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
    depends_on:
      artemis:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Target-adapter (connector-out): queue eam.workorder.v1 -> valideren -> monteur-model -> PUT werkorder-api
  # ---------------------------------------------------------------
  target-adapter:
    build:
      context: .
      dockerfile: target-adapter/Dockerfile
    container_name: target-adapter
    restart: unless-stopped
    environment:
      PORT: 8091
      BROKER_HOST: artemis
      BROKER_PORT: 61616
      BROKER_QUEUE: eam.workorder.v1
      BROKER_DLQ: eam.workorder.v1.dlq
      BROKER_USER: ${ARTEMIS_USER:-artemis}
      BROKER_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
      API_URL: http://werkorder-api:8081
      INTERN_API_KEY: ${INTERN_API_KEY:-dev-intern-sleutel}
    depends_on:
      artemis:
        condition: service_healthy
      werkorder-api:
        condition: service_healthy
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  # ---------------------------------------------------------------
  # Bronapp (OMS-simulator): vervangt producer.js. Zie bron-app/server.js en contracts/bron/.
  # Bedien hem met curl op http://localhost:8095. Met een lege ADAPTER_URL in .env draait hij droog.
  # ---------------------------------------------------------------
  bron-app:
    build: ./bron-app
    container_name: bron-app
    restart: unless-stopped
    environment:
      PORT: 8095
      ADAPTER_URL: ${ADAPTER_URL-http://source-adapter:8090/werkopdracht}      # alleen leeg als je dat in .env zo zet (dan draait hij droog)
      AUTO_INTERVAL_MS: ${BRON_AUTO_INTERVAL_MS:-0}
    depends_on:
      - source-adapter
    ports:
      - "127.0.0.1:8095:8095"
    mem_limit: 128m

volumes:
  redpanda-data:
  artemis-data:
  werkorder-data:

