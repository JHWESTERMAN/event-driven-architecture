services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"   # schema registry
      - "18082:18082"   # pandaproxy
      - "19092:19092"   # kafka (vanaf je host)
      - "9644:9644"     # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]

    command: >
      -c "
      for t in werkorder-notificaties werkorder-notificaties.dlq; do
        rpk topic describe $$t -X brokers=redpanda:9092 ||
        rpk topic create $$t -X brokers=redpanda:9092 -p 3;
      done
      "

  ws-microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: ws-microservice
    environment:
      - KAFKA_BROKER=redpanda:9092
      - KAFKA_TOPIC=werkorder-notificaties
      - PORT=8080
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped

  werkorder-api:
    build: ./werkorder-api
    container_name: werkorder-api
    restart: unless-stopped
    environment:
      PORT: 8081
    expose:
      - "8081" 

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - ws-microservice
      - werkorder-api

volumes:
  redpanda-data:
