<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monteur werkorders</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #1c2430;
      --muted: #5d6b7c;
      --border: #dde2e8;
      --accent: #1d5fd1;
      --accent-soft: #e6eefc;
      --open: #9a4a07;
      --open-bg: #fdf0dc;
      --prog: #1d5fd1;
      --prog-bg: #e6eefc;
      --done: #17703d;
      --done-bg: #e2f4e8;
      --danger: #b42318;
      --danger-bg: #fde8e6;
      --radius: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12171e;
        --surface: #1b222b;
        --text: #e8ecf1;
        --muted: #9aa7b6;
        --border: #2c3640;
        --accent: #6ea3ff;
        --accent-soft: #1f2d46;
        --open: #f5b461;
        --open-bg: #3a2c14;
        --prog: #8db6ff;
        --prog-bg: #1f2d46;
        --done: #6fd39a;
        --done-bg: #163325;
        --danger: #ff8b80;
        --danger-bg: #3b1a17;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- Kop ---------- */
    .kop {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .kop h1 { margin: 0; font-size: 1.1rem; }
    .kop-rechts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px 14px;
    }
    .gebruiker { font-size: 0.85rem; color: var(--muted); }

    /* ---------- Statusschermen (inloggen, uitgelogd, fout) ---------- */
    .keuze { max-width: 480px; margin: 24px auto; padding: 0 16px; }
    .keuze-inhoud { padding: 16px; }
    .keuze-inhoud .uitleg { margin: 0 0 16px; color: var(--muted); }

    .verbinding {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .verbinding .stip {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
    }
    .verbinding[data-toestand="verbonden"] { color: var(--done); border-color: var(--done); }
    .verbinding[data-toestand="verbonden"] .stip { background: var(--done); }
    .verbinding[data-toestand="verbroken"] { color: var(--danger); border-color: var(--danger); }
    .verbinding[data-toestand="verbroken"] .stip { background: var(--danger); }

    /* ---------- Indeling ---------- */
    main {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .paneel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 200px;
    }
    .paneel > h2 {
      margin: 0;
      padding: 12px 16px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .knop.terug { display: none; margin-bottom: 14px; }

    @media (max-width: 799px) {
      main { grid-template-columns: 1fr; padding: 12px; }
      main[data-weergave="lijst"] #detail-paneel { display: none; }
      main[data-weergave="detail"] #lijst-paneel { display: none; }
      .knop.terug { display: inline-flex; }
    }

    /* ---------- Meldingen ---------- */
    .meldingen { list-style: none; margin: 0; padding: 0; }
    .meldingen li + li { border-top: 1px solid var(--border); }

    .melding {
      display: block;
      width: 100%;
      padding: 12px 16px;
      text-align: left;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .melding:hover { background: var(--accent-soft); }
    .melding[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }

    .melding-bovenregel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .melding-id { font-weight: 650; }
    .melding[data-nieuw="true"] .melding-id::before {
      content: "";
      display: inline-block;
      width: 9px; height: 9px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .melding-tekst { margin: 2px 0; }
    .melding-tijd { font-size: 0.8rem; color: var(--muted); }

    .leeg {
      padding: 24px 16px;
      color: var(--muted);
    }

    /* ---------- Statusbadges ---------- */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge[data-status="OPEN"] { color: var(--open); background: var(--open-bg); }
    .badge[data-status="IN_BEHANDELING"] { color: var(--prog); background: var(--prog-bg); }
    .badge[data-status="AFGEROND"] { color: var(--done); background: var(--done-bg); }
    .badge[data-prioriteit="HOOG"] { color: var(--danger); background: var(--danger-bg); }
    .badge:not([data-status]):not([data-prioriteit="HOOG"]) { color: var(--muted); background: var(--bg); }

    /* ---------- Detail ---------- */
    .detail { padding: 16px; }
    .detail-kop {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 4px;
    }
    .detail-kop h3 { margin: 0; font-size: 1.3rem; }
    .detail .omschrijving { margin: 4px 0 16px; font-size: 1.05rem; }

    .waarschuwing {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--open);
      background: var(--open-bg);
      font-size: 0.9rem;
    }

    .velden {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 16px;
      margin: 0 0 20px;
    }
    .velden dt { color: var(--muted); }
    .velden dd { margin: 0; }

    .detail h4 {
      margin: 20px 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .taken { list-style: none; margin: 0; padding: 0; }
    .taken li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .taken li[data-gereed="true"] .taak-tekst { color: var(--muted); text-decoration: line-through; }
    .taken input { width: 20px; height: 20px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    td.getal, th.getal { text-align: right; }

    .voet {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .knop {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
    }
    .knop:hover { background: var(--accent-soft); }

    .fout {
      margin: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--danger);
      background: var(--danger-bg);
    }
    .fout p { margin: 0 0 10px; }

    .laden { padding: 24px 16px; color: var(--muted); }

    a { color: var(--accent); }

    @media (prefers-reduced-motion: no-preference) {
      .melding[data-vers="true"] { animation: oplichten 1.2s ease-out; }
      @keyframes oplichten { from { background: var(--accent-soft); } }
    }
  </style>
</head>
<body>
  <header class="kop">
    <h1>Mijn werkorders</h1>
    <div class="kop-rechts">
      <span id="gebruiker" class="gebruiker" hidden></span>
      <button id="herlogin" type="button" class="knop" hidden>Opnieuw inloggen</button>
      <div id="verbinding" class="verbinding" data-toestand="verbinden" role="status" aria-live="polite" hidden>
        <span class="stip" aria-hidden="true"></span>
        <span id="verbinding-tekst">Verbinden…</span>
      </div>
    </div>
  </header>

  <main id="hoofd" data-weergave="lijst" hidden>
    <section id="lijst-paneel" class="paneel" aria-labelledby="lijst-kop">
      <h2 id="lijst-kop">Meldingen</h2>
      <div id="lijst"></div>
    </section>

    <section id="detail-paneel" class="paneel" aria-labelledby="detail-kop">
      <h2 id="detail-kop">Werkorder</h2>
      <div id="detail"></div>
    </section>
  </main>

  <div id="keuze" class="keuze" hidden></div>

  <script>
    'use strict';

    // ----------------------------------------------------------------
    // Instellingen
    // ----------------------------------------------------------------
    const MONTEUR_PATROON = /^M-\d+$/;

    // Inloggen via Keycloak (OpenID Connect). De uitgever-URL is het adres waarmee DEZE BROWSER bij Keycloak komt.
    // Lokaal (Docker Compose of kubectl port-forward) is dat poort 8180 op localhost. Voor een andere omgeving
    // pas je OIDC_ISSUER aan, en zet je dezelfde waarde in OIDC_ISSUER van de services en in KC_HOSTNAME van Keycloak.
    const OIDC_ISSUER = 'http://localhost:8180/realms/werkorders';
    const OIDC_CLIENT_ID = 'monteur-app';
    const OIDC_PAD = OIDC_ISSUER + '/protocol/openid-connect';
    const REDIRECT_URI = location.origin + location.pathname;
    const VERNIEUW_MARGE_MS = 30000; // token vernieuwen als het binnen 30 seconden verloopt

    const WS_BASIS = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    const API_BASIS = '/api/werkorders/';
    const MAX_MELDINGEN = 50;
    const API_TIMEOUT_MS = 8000;
    const WACHT_MIN_MS = 1000;
    const WACHT_MAX_MS = 30000;

    const STATUS_TEKST = {
      OPEN: 'Open',
      IN_BEHANDELING: 'In behandeling',
      AFGEROND: 'Afgerond'
    };

    // ----------------------------------------------------------------
    // Toestand
    // ----------------------------------------------------------------
    const toestand = {
      meldingen: [],          // nieuwste eerst
      volgnummer: 0,
      geselecteerd: null,     // volgnummer van de gekozen melding
      verzoekNummer: 0,       // om verouderde antwoorden te negeren
      detail: { fase: 'leeg' } // leeg | laden | ok | fout
    };

    // ----------------------------------------------------------------
    // Bewaren in de browser (localStorage), per monteur
    // Zo blijft de lijst bestaan na wisselen van monteur of herladen.
    // Let op: dit is alleen een lokale kopie in deze browser. Meldingen die
    // binnenkwamen terwijl de app dicht was, staan hier niet in.
    // Alles is in try/catch gezet: opslag kan geblokkeerd of vol zijn.
    // ----------------------------------------------------------------
    // De sleutel bevat het monteur-id uit het token, zodat twee monteurs op één apparaat elkaars lijst niet zien.
    const opslagSleutel = () => 'meldingen:' + sessie.monteurId;

    function bewaar() {
      try {
        const opTeSlaan = toestand.meldingen.map((m) => ({
          nr: m.nr,
          eventId: m.eventId,
          werkorderId: m.werkorderId,
          status: m.status,
          bericht: m.bericht,
          tijdstip: m.tijdstip,
          ontvangen: m.ontvangen.toISOString(),
          inhaal: m.inhaal,
          nieuw: m.nieuw
        }));
        localStorage.setItem(opslagSleutel(), JSON.stringify(opTeSlaan));
      } catch (fout) {
        console.warn('Meldingen niet bewaard:', fout.message);
      }
    }

    function herstel() {
      try {
        const tekst = localStorage.getItem(opslagSleutel());
        if (!tekst) return;
        const lijst = JSON.parse(tekst);
        if (!Array.isArray(lijst)) return;

        toestand.meldingen = lijst
          .filter((m) => m && typeof m.werkorderId === 'string' && Number.isInteger(m.nr))
          .map((m) => {
            const ontvangen = new Date(m.ontvangen);
            return {
              nr: m.nr,
              eventId: typeof m.eventId === 'string' && m.eventId ? m.eventId : null,
              werkorderId: m.werkorderId,
              status: typeof m.status === 'string' ? m.status : '',
              bericht: typeof m.bericht === 'string' ? m.bericht : '',
              // Oudere bewaarde meldingen hebben geen servertijdstip: dan het moment van ontvangst
              tijdstip: Number.isFinite(m.tijdstip) ? m.tijdstip : ontvangen.getTime(),
              ontvangen,
              inhaal: m.inhaal === true,
              nieuw: m.nieuw === true,
              vers: false
            };
          })
          .filter((m) => !Number.isNaN(m.ontvangen.getTime()))
          .sort((a, b) => (b.tijdstip - a.tijdstip) || (b.nr - a.nr))
          .slice(0, MAX_MELDINGEN);

        toestand.volgnummer = toestand.meldingen.reduce((hoogste, m) => Math.max(hoogste, m.nr), 0);
      } catch (fout) {
        console.warn('Bewaarde meldingen onleesbaar, we beginnen leeg:', fout.message);
        toestand.meldingen = [];
      }
    }

    // ----------------------------------------------------------------
    // Hulpfuncties
    // Alle data uit netwerk of API gaat via textContent, nooit via innerHTML.
    // ----------------------------------------------------------------
    function el(tag, props = {}, ...kinderen) {
      const knoop = document.createElement(tag);
      for (const [sleutel, waarde] of Object.entries(props)) {
        if (waarde === false || waarde == null) continue;
        if (sleutel === 'class') knoop.className = waarde;
        else if (sleutel === 'text') knoop.textContent = waarde;
        else if (sleutel.startsWith('on')) knoop.addEventListener(sleutel.slice(2), waarde);
        else knoop.setAttribute(sleutel, waarde === true ? '' : waarde);
      }
      for (const kind of kinderen.flat()) {
        if (kind == null || kind === false) continue;
        knoop.append(kind.nodeType ? kind : document.createTextNode(String(kind)));
      }
      return knoop;
    }

    function leegMaken(knoop) {
      while (knoop.firstChild) knoop.removeChild(knoop.firstChild);
    }

    function statusBadge(status) {
      return el('span', { class: 'badge', 'data-status': status, text: STATUS_TEKST[status] || status });
    }

    function tijd(datum) {
      return datum.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function datumTijd(iso) {
      const datum = new Date(iso);
      if (Number.isNaN(datum.getTime())) return String(iso);
      return datum.toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' });
    }

    // ----------------------------------------------------------------
    // Inloggen (OpenID Connect: authorization code met PKCE, zonder geheim)
    //
    // 1. Geen sessie? Dan sturen we de browser naar Keycloak, met een willekeurige "verifier" (bewaard in
    //    sessionStorage) waarvan alleen de hash meegaat. Daarmee kan niemand die de code onderschept hem inwisselen.
    // 2. Keycloak stuurt de browser terug met een code. Die wisselen we in voor tokens.
    // 3. De tokens leven alleen in het geheugen van deze pagina, nooit in localStorage.
    //    Na herladen logt de app opnieuw in; Keycloak herkent de sessie, dus dat gaat zonder wachtwoord.
    // 4. Het access token is kort geldig (5 minuten) en wordt vernieuwd met het refresh token.
    //
    // De app leest het token alleen om de naam en het monteur-id te tonen. De ECHTE controle (handtekening,
    // eigenaar) doen de services: wat de browser zelf over zichzelf beweert, wordt nooit vertrouwd.
    // ----------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const sessie = { access: null, refresh: null, idToken: null, verlooptOp: 0, monteurId: null, naam: '' };
    let verversBezig = null;

    function opslagLees(sleutel) {
      try { return sessionStorage.getItem(sleutel); } catch (fout) { return null; }
    }
    function opslagSchrijf(sleutel, waarde) {
      try { sessionStorage.setItem(sleutel, waarde); return true; } catch (fout) { return false; }
    }
    function opslagWis(sleutel) {
      try { sessionStorage.removeItem(sleutel); } catch (fout) { /* niets aan te doen */ }
    }

    function base64url(bytes) {
      let tekst = '';
      for (const byte of bytes) tekst += String.fromCharCode(byte);
      return btoa(tekst).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function willekeurig(aantalBytes) {
      return base64url(crypto.getRandomValues(new Uint8Array(aantalBytes)));
    }

    async function pkceChallenge(verifier) {
      const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
      return base64url(new Uint8Array(hash));
    }

    function decodeerPayload(jwt) {
      const deel = jwt.split('.')[1] || '';
      const binair = atob(deel.replace(/-/g, '+').replace(/_/g, '/'));
      const json = decodeURIComponent(Array.from(binair, (c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
      return JSON.parse(json);
    }

    function zetSessie(tokens) {
      const claims = decodeerPayload(tokens.access_token);
      const monteurId = String(claims.preferred_username || '').toUpperCase();
      if (!MONTEUR_PATROON.test(monteurId)) throw new Error('Dit account is geen monteur-account.');

      sessie.access = tokens.access_token;
      sessie.refresh = tokens.refresh_token || sessie.refresh;
      sessie.idToken = tokens.id_token || sessie.idToken;
      // We rekenen met "expires_in" (relatief) en niet met de klok in het token, zodat een afwijkende klok niet uitmaakt
      sessie.verlooptOp = Date.now() + (Number(tokens.expires_in) || 60) * 1000;
      sessie.monteurId = monteurId;
      sessie.naam = typeof claims.name === 'string' && claims.name ? claims.name : monteurId;
    }

    async function startLogin() {
      if (!(window.crypto && crypto.subtle)) {
        throw new Error('Inloggen werkt alleen via https of op localhost: de browser biedt hier geen versleuteling aan.');
      }
      const verifier = willekeurig(48);
      const state = willekeurig(16);
      if (!opslagSchrijf('pkce-verifier', verifier) || !opslagSchrijf('pkce-state', state)) {
        throw new Error('De browser staat geen sessieopslag toe, en daar is inloggen op aangewezen.');
      }
      const url = new URL(OIDC_PAD + '/auth');
      url.search = new URLSearchParams({
        client_id: OIDC_CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: 'code',
        scope: 'openid',
        code_challenge: await pkceChallenge(verifier),
        code_challenge_method: 'S256',
        state
      }).toString();
      location.assign(url.toString());
    }

    // Vraagt tokens aan bij Keycloak. Foutsoorten:
    //   fout.herlogin      = de inlogserver zegt nee (code of refresh token ongeldig): opnieuw inloggen is nodig
    //   fout.onbereikbaar  = de inlogserver antwoordt niet: later opnieuw proberen
    async function tokenAanvraag(velden) {
      let antwoord;
      try {
        antwoord = await fetch(OIDC_PAD + '/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ client_id: OIDC_CLIENT_ID, ...velden }),
          signal: AbortSignal.timeout(8000)
        });
      } catch (fout) {
        const nieuw = new Error('De inlogserver is niet bereikbaar.');
        nieuw.onbereikbaar = true;
        throw nieuw;
      }

      let inhoud = null;
      try { inhoud = await antwoord.json(); } catch (fout) { /* geen JSON */ }

      if (!antwoord.ok || !inhoud || !inhoud.access_token) {
        const nieuw = new Error((inhoud && (inhoud.error_description || inhoud.error)) || `Fout ${antwoord.status}`);
        nieuw.herlogin = antwoord.status >= 400 && antwoord.status < 500;
        nieuw.onbereikbaar = !nieuw.herlogin;
        throw nieuw;
      }
      zetSessie(inhoud);
    }

    async function verwerkTerugkeer(params) {
      if (params.get('error')) {
        throw new Error('Inloggen mislukt: ' + (params.get('error_description') || params.get('error')));
      }
      const verwachteState = opslagLees('pkce-state');
      const verifier = opslagLees('pkce-verifier');
      opslagWis('pkce-state');      // eenmalig gebruik
      opslagWis('pkce-verifier');

      if (!verwachteState || !verifier || params.get('state') !== verwachteState || !params.get('code')) {
        throw new Error('De terugkeer van de inlogpagina klopt niet. Probeer het opnieuw.');
      }
      await tokenAanvraag({
        grant_type: 'authorization_code',
        code: params.get('code'),
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });
      history.replaceState(null, '', REDIRECT_URI); // code en state uit de adresbalk halen
    }

    function ververs() {
      if (verversBezig) return verversBezig; // meerdere tegelijk? één vernieuwing voor allemaal
      verversBezig = (async () => {
        if (!sessie.refresh) {
          const fout = new Error('Er is geen sessie meer.');
          fout.herlogin = true;
          throw fout;
        }
        await tokenAanvraag({ grant_type: 'refresh_token', refresh_token: sessie.refresh });
      })().finally(() => { verversBezig = null; });
      return verversBezig;
    }

    async function geldigToken(forceer = false) {
      if (forceer || !sessie.access || sessie.verlooptOp - Date.now() < VERNIEUW_MARGE_MS) {
        await ververs();
      }
      return sessie.access;
    }

    function uitloggen() {
      // Op een gedeeld apparaat hoort een volgende monteur niet de meldingen van de vorige te zien
      try { localStorage.removeItem(opslagSleutel()); } catch (fout) { /* opslag niet beschikbaar */ }
      const url = new URL(OIDC_PAD + '/logout');
      const velden = { client_id: OIDC_CLIENT_ID, post_logout_redirect_uri: REDIRECT_URI + '?uitgelogd=1' };
      if (sessie.idToken) velden.id_token_hint = sessie.idToken;
      url.search = new URLSearchParams(velden).toString();
      location.assign(url.toString());
    }

    // API-aanroep met token. Bij een 401 vernieuwen we het token één keer en proberen het opnieuw.
    async function apiFetch(url, signal) {
      for (let poging = 0; poging < 2; poging++) {
        const token = await geldigToken(poging === 1);
        const antwoord = await fetch(url, {
          headers: { Accept: 'application/json', Authorization: 'Bearer ' + token },
          cache: 'no-store',
          signal
        });
        if (antwoord.status !== 401 || poging === 1) return antwoord;
      }
    }

    // ----------------------------------------------------------------
    // Verbinding (WebSocket) met automatisch herverbinden
    // Wachttijd verdubbelt per mislukte poging, met een willekeurige vertraging,
    // zodat niet alle monteurs na een herstart tegelijk terugkomen.
    // ----------------------------------------------------------------
    let socket = null;
    let pogingen = 0;
    let aftelTimer = null;

    function zetVerbinding(staat, tekst) {
      document.getElementById('verbinding').dataset.toestand = staat;
      document.getElementById('verbinding-tekst').textContent = tekst;
    }

    // Bij elke verbinding vertellen we de server vanaf wanneer we meldingen missen:
    // het tijdstip van de nieuwste melding die we hebben, of het begin der tijden als we niets hebben.
    // De server stuurt dan na wat hij voor ons bewaard heeft (inclusief die laatste, die we ontdubbelen).
    // Het token zit niet in de URL (die komt in logs terecht) maar gaat als eerste bericht mee.
    function maakWsUrl() {
      const nieuwste = toestand.meldingen.reduce((hoogste, m) => Math.max(hoogste, m.tijdstip), 0);
      return WS_BASIS + '?since=' + encodeURIComponent(new Date(nieuwste).toISOString());
    }

    let laatste4401 = 0;

    async function verbind() {
      clearInterval(aftelTimer);
      $('herlogin').hidden = true;
      zetVerbinding('verbinden', 'Verbinden…');

      // Eerst een geldig token (zo nodig vernieuwen)
      let token;
      try {
        token = await geldigToken();
      } catch (fout) {
        if (fout.herlogin) {
          zetVerbinding('verbroken', 'Je sessie is verlopen');
          $('herlogin').hidden = false;
        } else {
          planOpnieuw(); // inlogserver tijdelijk weg: opnieuw proberen met uitstel
        }
        return;
      }

      let dezeSocket;
      try {
        dezeSocket = new WebSocket(maakWsUrl());
      } catch (fout) {
        planOpnieuw();
        return;
      }
      socket = dezeSocket;

      dezeSocket.addEventListener('open', () => {
        // Eerste bericht: wie ben ik. Pas daarna weet de server voor wie hij meldingen heeft.
        dezeSocket.send(JSON.stringify({ type: 'AUTH', token }));
      });

      dezeSocket.addEventListener('message', (gebeurtenis) => {
        if (dezeSocket !== socket) return; // bericht van een verouderde verbinding
        let bericht;
        try {
          bericht = JSON.parse(gebeurtenis.data);
        } catch (fout) {
          console.warn('Onleesbaar bericht genegeerd:', gebeurtenis.data);
          return;
        }
        if (bericht && bericht.type === 'SYSTEM') {
          // De server heeft ons token geaccepteerd: nu pas zijn we echt verbonden
          pogingen = 0;
          zetVerbinding('verbonden', 'Verbonden');
          return;
        }
        verwerkBericht(bericht);
      });

      dezeSocket.addEventListener('close', (gebeurtenis) => {
        if (dezeSocket !== socket) return;

        if (gebeurtenis.code === 4401) {
          // Ons token is verlopen. Vernieuwen en direct opnieuw verbinden; de server stuurt via ?since= na wat we misten.
          // Gebeurt dit steeds opnieuw (bijvoorbeeld door klokverschil), dan vallen we terug op de gewone wachttijd.
          if (Date.now() - laatste4401 > 5000) {
            laatste4401 = Date.now();
            verbind();
          } else {
            planOpnieuw();
          }
          return;
        }
        if (gebeurtenis.code === 1008) {
          // De server weigert ons bewust. Opnieuw proberen met hetzelfde token heeft geen zin.
          zetVerbinding('verbroken', 'Verbinding geweigerd: ' + (gebeurtenis.reason || 'niet toegestaan'));
          $('herlogin').hidden = false;
          return;
        }
        planOpnieuw();
      });
      dezeSocket.addEventListener('error', () => { /* 'close' volgt altijd; daar handelen we het af */ });
    }

    function planOpnieuw() {
      clearInterval(aftelTimer);
      pogingen += 1;

      const basis = Math.min(WACHT_MAX_MS, WACHT_MIN_MS * 2 ** (pogingen - 1));
      const wacht = Math.round(basis / 2 + Math.random() * (basis / 2));
      let resterend = Math.ceil(wacht / 1000);

      const toon = () => zetVerbinding('verbroken', `Verbroken, opnieuw proberen over ${resterend} s`);
      toon();

      aftelTimer = setInterval(() => {
        resterend -= 1;
        if (resterend <= 0) {
          clearInterval(aftelTimer);
          verbind();
        } else {
          toon();
        }
      }, 1000);
    }

    // ----------------------------------------------------------------
    // Meldingen
    // ----------------------------------------------------------------
    function verwerkBericht(bericht) {
      if (!bericht || typeof bericht !== 'object') return;
      if (bericht.type === 'SYSTEM') return; // welkomstbericht

      if (typeof bericht.werkorderId !== 'string' || !bericht.werkorderId) {
        console.warn('Melding zonder werkorderId genegeerd:', bericht);
        return;
      }

      // Dezelfde melding kan twee keer komen (bij inhalen, of bij herlevering door Kafka)
      const eventId = typeof bericht.eventId === 'string' && bericht.eventId ? bericht.eventId : null;
      if (eventId && toestand.meldingen.some((m) => m.eventId === eventId)) return;

      // Het tijdstip komt van de server (Kafka). Zonder geldig tijdstip nemen we het moment van ontvangst.
      const serverTijd = typeof bericht.tijdstip === 'string' ? Date.parse(bericht.tijdstip) : NaN;
      const tijdstip = Number.isNaN(serverTijd) ? Date.now() : serverTijd;

      toestand.volgnummer += 1;
      toestand.meldingen.push({
        nr: toestand.volgnummer,
        eventId,
        werkorderId: bericht.werkorderId,
        status: typeof bericht.status === 'string' ? bericht.status : '',
        bericht: typeof bericht.bericht === 'string' ? bericht.bericht : '',
        tijdstip,
        ontvangen: new Date(tijdstip),
        inhaal: bericht.inhaal === true, // gemist en nu alsnog opgehaald
        nieuw: true,  // ongelezen, tot de monteur de melding opent
        vers: true    // alleen voor de oplicht-animatie bij binnenkomst
      });

      // Nieuwste bovenaan, op het tijdstip van de melding (ingehaalde komen zo op de juiste plek)
      toestand.meldingen.sort((a, b) => (b.tijdstip - a.tijdstip) || (b.nr - a.nr));
      toestand.meldingen.length = Math.min(toestand.meldingen.length, MAX_MELDINGEN);
      bewaar();
      tekenLijst();
    }

    function tekenLijst() {
      const houder = document.getElementById('lijst');
      leegMaken(houder);

      if (toestand.meldingen.length === 0) {
        houder.append(el('p', {
          class: 'leeg',
          text: 'Nog geen meldingen. Zodra er een werkorder wordt toegewezen of gewijzigd, verschijnt die hier.'
        }));
        return;
      }

      const lijst = el('ul', { class: 'meldingen' });
      for (const melding of toestand.meldingen) {
        const knop = el('button', {
          type: 'button',
          class: 'melding',
          'data-nieuw': String(melding.nieuw),
          'data-vers': String(melding.vers),
          'aria-current': String(melding.nr === toestand.geselecteerd),
          onclick: () => kies(melding.nr)
        },
          el('div', { class: 'melding-bovenregel' },
            el('span', { class: 'melding-id', text: melding.werkorderId }),
            melding.status ? statusBadge(melding.status) : null
          ),
          melding.bericht ? el('div', { class: 'melding-tekst', text: melding.bericht }) : null,
          el('div', {
            class: 'melding-tijd',
            text: 'Gemeld om ' + tijd(melding.ontvangen) + (melding.inhaal ? ' · ingehaald' : '')
          })
        );
        lijst.append(el('li', {}, knop));
        melding.vers = false; // animatie speelt alleen bij de eerste tekening
      }
      houder.append(lijst);
    }

    function kies(nr) {
      const melding = toestand.meldingen.find((m) => m.nr === nr);
      if (!melding) return;
      melding.nieuw = false;
      bewaar();
      toestand.geselecteerd = nr;
      document.getElementById('hoofd').dataset.weergave = 'detail';
      tekenLijst();
      haalWerkorderOp(melding);
    }

    // ----------------------------------------------------------------
    // Werkorder ophalen (synchroon request/response)
    // ----------------------------------------------------------------
    async function haalWerkorderOp(melding) {
      const nummer = ++toestand.verzoekNummer;
      toestand.detail = { fase: 'laden', melding };
      tekenDetail();

      const afbreker = new AbortController();
      const timer = setTimeout(() => afbreker.abort(), API_TIMEOUT_MS);

      try {
        const antwoord = await apiFetch(API_BASIS + encodeURIComponent(melding.werkorderId), afbreker.signal);

        let inhoud = null;
        try { inhoud = await antwoord.json(); } catch (fout) { /* geen JSON */ }

        if (nummer !== toestand.verzoekNummer) return; // inmiddels een andere melding gekozen

        if (!antwoord.ok) {
          const uitleg = inhoud && inhoud.detail ? inhoud.detail : `Fout ${antwoord.status}`;
          toestand.detail = { fase: 'fout', melding, tekst: uitleg, status: antwoord.status };
        } else {
          toestand.detail = { fase: 'ok', melding, data: inhoud, opgehaald: new Date() };
        }
      } catch (fout) {
        if (nummer !== toestand.verzoekNummer) return;
        if (fout.herlogin) {
          toestand.detail = { fase: 'fout', melding, status: 401, tekst: 'Je sessie is verlopen. Log opnieuw in.' };
        } else if (fout.onbereikbaar) {
          toestand.detail = { fase: 'fout', melding, tekst: fout.message };
        } else {
          const tekst = fout.name === 'AbortError'
            ? 'De server antwoordt niet op tijd.'
            : 'De werkorder kon niet worden opgehaald. Controleer je verbinding.';
          toestand.detail = { fase: 'fout', melding, tekst };
        }
      } finally {
        clearTimeout(timer);
      }

      tekenDetail();
    }

    // ----------------------------------------------------------------
    // Detailweergave
    // ----------------------------------------------------------------
    function terugKnop() {
      return el('button', {
        type: 'button',
        class: 'knop terug',
        onclick: () => { document.getElementById('hoofd').dataset.weergave = 'lijst'; }
      }, '← Terug naar meldingen');
    }

    function tekenDetail() {
      const houder = document.getElementById('detail');
      leegMaken(houder);
      const { fase, melding } = toestand.detail;

      if (fase === 'leeg') {
        houder.append(el('p', { class: 'leeg', text: 'Kies een melding om de volledige werkorder te zien.' }));
        return;
      }

      if (fase === 'laden') {
        houder.append(el('p', { class: 'laden', role: 'status', text: `${melding.werkorderId} ophalen…` }));
        return;
      }

      if (fase === 'fout') {
        const status = toestand.detail.status;
        const kop = status === 404 ? 'Werkorder niet gevonden'
          : status === 403 ? 'Geen toegang'
          : status === 401 ? 'Niet ingelogd'
          : 'Ophalen mislukt';
        // Bij "geen toegang" heeft opnieuw proberen geen zin; bij een verlopen sessie is opnieuw inloggen de oplossing.
        const actie = status === 403 ? null
          : status === 401
            ? el('button', { type: 'button', class: 'knop', onclick: opnieuwInloggen }, 'Opnieuw inloggen')
            : el('button', { type: 'button', class: 'knop', onclick: () => haalWerkorderOp(melding) }, 'Opnieuw proberen');
        houder.append(el('div', { class: 'fout', role: 'alert' },
          el('p', {}, el('strong', { text: kop }), ' – ', toestand.detail.tekst),
          el('div', {}, actie, actie ? ' ' : null, terugKnop())
        ));
        return;
      }

      houder.append(maakWerkorder(toestand.detail.data, melding, toestand.detail.opgehaald));
    }

    function maakWerkorder(w, melding, opgehaald) {
      const verschil = melding.status && melding.status !== w.status;

      const taken = Array.isArray(w.taken) ? w.taken : [];
      const klaar = taken.filter((t) => t.gereed).length;
      const materiaal = Array.isArray(w.materiaal) ? w.materiaal : [];
      const loc = w.locatie || {};
      const co = loc.coordinaten;

      return el('article', { class: 'detail' },
        terugKnop(),
        el('div', { class: 'detail-kop' },
          el('h3', { text: w.werkorderId }),
          statusBadge(w.status),
          w.prioriteit === 'HOOG'
            ? el('span', { class: 'badge', 'data-prioriteit': 'HOOG', text: 'Hoge prioriteit' })
            : el('span', { class: 'badge', text: 'Prioriteit: ' + String(w.prioriteit || '').toLowerCase() })
        ),
        el('p', { class: 'omschrijving', text: w.omschrijving }),

        verschil ? el('p', { class: 'waarschuwing', role: 'status' },
          `De melding zei "${STATUS_TEKST[melding.status] || melding.status}", maar de actuele status is ` +
          `"${STATUS_TEKST[w.status] || w.status}". Je ziet hier de actuele toestand.`) : null,

        el('dl', { class: 'velden' },
          el('dt', { text: 'Locatie' }),
          el('dd', {},
            [loc.spoorEmplacement, loc.plaats].filter(Boolean).join(', '),
            co && Number.isFinite(co.lat) && Number.isFinite(co.lon)
              ? [' ', el('a', {
                  href: `https://www.openstreetmap.org/?mlat=${co.lat}&mlon=${co.lon}#map=16/${co.lat}/${co.lon}`,
                  target: '_blank',
                  rel: 'noopener noreferrer',
                  text: '(kaart)'
                })]
              : null
          ),
          el('dt', { text: 'Monteur' }),
          el('dd', { text: w.monteur ? `${w.monteur.naam} (${w.monteur.id})` : 'Niet toegewezen' }),
          el('dt', { text: 'Aangemaakt' }),
          el('dd', { text: datumTijd(w.aangemaaktOp) })
        ),

        el('h4', { text: `Taken (${klaar} van ${taken.length} gereed)` }),
        taken.length === 0
          ? el('p', { class: 'leeg', text: 'Geen taken.' })
          : el('ul', { class: 'taken' }, taken.map((t) =>
              el('li', { 'data-gereed': String(Boolean(t.gereed)) },
                el('input', { type: 'checkbox', disabled: true, checked: Boolean(t.gereed) ? true : false,
                              'aria-label': t.omschrijving }),
                el('span', { class: 'taak-tekst', text: t.omschrijving })
              ))),

        el('h4', { text: 'Materiaal' }),
        materiaal.length === 0
          ? el('p', { class: 'leeg', text: 'Geen materiaal nodig.' })
          : el('table', {},
              el('thead', {}, el('tr', {},
                el('th', { text: 'Artikel' }),
                el('th', { text: 'Omschrijving' }),
                el('th', { class: 'getal', text: 'Aantal' }))),
              el('tbody', {}, materiaal.map((m) => el('tr', {},
                el('td', { text: m.artikelnr }),
                el('td', { text: m.omschrijving }),
                el('td', { class: 'getal', text: String(m.aantal) }))))),

        el('div', { class: 'voet' },
          el('span', { text: 'Opgehaald om ' + tijd(opgehaald) }),
          el('button', { type: 'button', class: 'knop', onclick: () => haalWerkorderOp(melding) }, 'Vernieuwen')
        )
      );
    }

    // ----------------------------------------------------------------
    // Start
    // ----------------------------------------------------------------
    function toonScherm(titel, tekst, knop) {
      $('hoofd').hidden = true;
      $('verbinding').hidden = true;
      $('gebruiker').hidden = true;
      $('herlogin').hidden = true;

      const houder = $('keuze');
      houder.hidden = false;
      leegMaken(houder);
      houder.append(el('section', { class: 'paneel' },
        el('h2', { text: titel }),
        el('div', { class: 'keuze-inhoud' },
          el('p', { class: 'uitleg', text: tekst }),
          knop ? el('button', { type: 'button', class: 'knop', onclick: knop.actie, text: knop.tekst }) : null
        )
      ));
    }

    function opnieuwInloggen() {
      location.assign(REDIRECT_URI); // zonder sessie stuurt de start ons naar Keycloak
    }

    function startApp() {
      $('keuze').hidden = true;
      $('hoofd').hidden = false;
      $('verbinding').hidden = false;

      const gebruiker = $('gebruiker');
      gebruiker.hidden = false;
      leegMaken(gebruiker);
      gebruiker.append(
        `Ingelogd als ${sessie.naam} (${sessie.monteurId}) · `,
        el('a', { href: '#', text: 'Uitloggen', onclick: (gebeurtenis) => { gebeurtenis.preventDefault(); uitloggen(); } })
      );

      herstel();
      tekenLijst();
      tekenDetail();
      verbind();
    }

    async function start() {
      $('herlogin').addEventListener('click', opnieuwInloggen);
      const params = new URLSearchParams(location.search);

      try {
        if (params.has('uitgelogd')) {
          toonScherm('Uitgelogd',
            'Je bent uitgelogd. De meldingen die op dit apparaat bewaard waren, zijn gewist.',
            { tekst: 'Opnieuw inloggen', actie: opnieuwInloggen });
          return;
        }

        if (params.has('code') || params.has('error')) {
          toonScherm('Inloggen…', 'Even geduld, je wordt ingelogd.');
          await verwerkTerugkeer(params);
        } else {
          toonScherm('Inloggen…', 'Je wordt doorgestuurd naar de inlogpagina.');
          await startLogin();
          return; // de browser gaat nu naar Keycloak
        }
      } catch (fout) {
        toonScherm('Inloggen mislukt', fout.message, { tekst: 'Opnieuw proberen', actie: opnieuwInloggen });
        return;
      }

      startApp();
    }

    start();
  </script>
</body>
</html>
