openapi: 3.0.3

info:
  title: Werkorder API
  version: 1.0.0
  description: |
    Synchrone API om de volledige werkorder op te halen nadat de monteur een
    (dunne) notificatie heeft ontvangen.

    Het Kafka-event en de WebSocket-notificatie bevatten alleen `werkorderId`,
    `status` en `bericht`. Deze API levert het volledige detail op het moment dat
    de monteur het nodig heeft, zodat hij altijd de actuele toestand ziet.

    **Authenticatie en autorisatie.** Elk verzoek onder `/api/` vereist een access token van Keycloak
    (OpenID Connect) in de header `Authorization: Bearer <token>`. Het monteur-id komt uit het token
    (de gebruikersnaam, bijvoorbeeld `m-017` voor monteur `M-017`), nooit uit de URL of de body.
    Een geldig token is niet genoeg: een monteur ziet alleen zijn eigen werkorders. Een werkorder van
    een ander geeft `403`, en de lijst bevat alleen de eigen werkorders.

servers:
  - url: http://localhost
    description: Lokale API-gateway (nginx)

security:
  - bearerAuth: []

tags:
  - name: Werkorders
    description: Werkorders ophalen
  - name: Beheer
    description: Gezondheidscontrole
  - name: Intern
    description: |
      Schrijf-API voor de target-adapter. Niet bedoeld voor de monteursapp en niet bereikbaar via de gateway
      (die stuurt alleen `/ws` en `/api/` door).

paths:
  /api/werkorders:
    get:
      tags: [Werkorders]
      operationId: lijstWerkorders
      summary: Lijst met werkorders
      description: |
        Compacte lijst van **je eigen** werkorders, optioneel gefilterd op status en beperkt in aantal.
        Werkorders van andere monteurs komen er nooit in voor, ook niet in `totaal`.
      parameters:
        - name: status
          in: query
          required: false
          description: Alleen werkorders met deze status.
          schema:
            $ref: '#/components/schemas/Status'
        - name: limit
          in: query
          required: false
          description: Maximaal aantal resultaten.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Lijst met werkorders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WerkorderLijst'
              example:
                totaal: 1
                items:
                  - werkorderId: WO-1001
                    status: OPEN
                    prioriteit: HOOG
                    omschrijving: Storing wissel 214, wisselmotor reageert niet
        '400':
          $ref: '#/components/responses/OngeldigVerzoek'
        '401':
          $ref: '#/components/responses/NietGeauthenticeerd'
        '503':
          $ref: '#/components/responses/TijdelijkNietBeschikbaar'

  /api/werkorders/{werkorderId}:
    get:
      tags: [Werkorders]
      operationId: haalWerkorderOp
      summary: Volledige werkorder ophalen
      description: |
        Geeft alle gegevens van één werkorder, inclusief taken en materiaal.
        Alleen de monteur aan wie de werkorder is toegewezen, mag hem opvragen.
      parameters:
        - name: werkorderId
          in: path
          required: true
          description: Identificatie van de werkorder, `WO-` gevolgd door cijfers.
          schema:
            type: string
            pattern: '^WO-[0-9]+$'
          example: WO-1002
      responses:
        '200':
          description: De volledige werkorder.
          headers:
            Cache-Control:
              description: Altijd `no-store`, zodat de monteur nooit een verouderde werkorder ziet.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Werkorder'
        '400':
          $ref: '#/components/responses/OngeldigVerzoek'
        '401':
          $ref: '#/components/responses/NietGeauthenticeerd'
        '403':
          $ref: '#/components/responses/GeenToegang'
        '404':
          $ref: '#/components/responses/NietGevonden'
        '503':
          $ref: '#/components/responses/TijdelijkNietBeschikbaar'

  /intern/werkorders/{werkorderId}:
    put:
      tags: [Intern]
      operationId: werkorderOpslaan
      summary: Werkorder aanmaken, bijwerken of intrekken (alleen target-adapter)
      description: |
        Idempotent op `versie`: een bericht met een versie die niet hoger is dan de opgeslagen versie
        wordt genegeerd (`GENEGEERD`) en geeft toch `200`, zodat de adapter het bericht kan bevestigen.
        Een intrekking voor een nog onbekende werkorder wordt bewaard als tombstone (`TOMBSTONE_BEWAARD`);
        een latere, lagere versie wordt daarna genegeerd.

        Bij een wijziging schrijft de API in dezelfde database-transactie de bijbehorende events in de
        outbox (topics `werkorder-events` en `werkorder-notificaties`). Een versie-ophoging zonder
        inhoudelijke wijziging maakt geen events.

        Beveiliging: Bearer-token van het Keycloak-service-account `target-adapter` (client credentials). Het token moet
        voor `werkorders-api` bedoeld zijn, uitgegeven zijn aan die client (`azp`) en de realmrol `werkorder-schrijver`
        hebben. Een monteurtoken geeft dus `401`, en een service-token mag de monteur-API niet lezen.
        Alleen voor lokaal testen zonder Keycloak bestaat nog de gedeelde sleutel in `X-Api-Key`, als `INTERN_API_KEY` is gezet.
      security:
        - serviceAccount: []
        - internApiKey: []
      parameters:
        - name: werkorderId
          in: path
          required: true
          schema:
            type: string
            pattern: '^WO-[0-9]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternOpslaan'
      responses:
        '200':
          description: Verwerkt, genegeerd (oude versie) of als tombstone bewaard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternResultaat'
        '400':
          $ref: '#/components/responses/OngeldigVerzoek'
        '401':
          description: Ontbrekend, ongeldig of verlopen token (of een token van een andere client).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleem'
        '403':
          description: Het token is geldig en van de juiste client, maar de rol `werkorder-schrijver` ontbreekt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probleem'
        '413':
          description: Body groter dan 256 KiB.
        '415':
          description: Content-Type is niet application/json.
        '422':
          description: De werkorder voldoet niet aan het contract. Permanente fout, opnieuw proberen helpt niet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer }
                  title: { type: string }
                  detail: { type: string }
                  fouten:
                    type: array
                    items: { type: string }
        '503':
          description: De sleutels van de identity provider zijn tijdelijk niet op te halen; opnieuw proberen.

  /health:
    get:
      tags: [Beheer]
      operationId: gezondheid
      summary: Gezondheidscontrole
      description: Zonder token bereikbaar, zodat Docker en Kubernetes de service kunnen controleren.
      security: []
      responses:
        '200':
          description: De service draait.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]

components:
  securitySchemes:
    serviceAccount:
      type: oauth2
      description: Service-account van de target-adapter (Keycloak, realm werkorders, client `target-adapter`).
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/werkorders/protocol/openid-connect/token
          scopes: {}
    internApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Alleen voor lokaal testen zonder Keycloak, en alleen als INTERN_API_KEY is gezet.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token van Keycloak (realm `werkorders`). Het token moet RS256 zijn ondertekend, de juiste
        uitgever (`iss`) hebben, bedoeld zijn voor `werkorders-api` (`aud`) en niet verlopen zijn. De
        gebruikersnaam (`preferred_username`) is het monteur-id in kleine letters.

  responses:
    NietGeauthenticeerd:
      description: Het token ontbreekt, is ongeldig of is verlopen. De precieze reden staat alleen in de log van de server.
      headers:
        WWW-Authenticate:
          description: Het verwachte schema, bijvoorbeeld `Bearer realm="werkorders", error="invalid_token"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probleem'
          example:
            status: 401
            title: Unauthorized
            detail: Het token is ongeldig of verlopen
    GeenToegang:
      description: Het token is geldig, maar de werkorder hoort bij een andere monteur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probleem'
          example:
            status: 403
            title: Forbidden
            detail: Je hebt geen toegang tot werkorder WO-1003
    TijdelijkNietBeschikbaar:
      description: |
        De API kan het token op dit moment niet controleren, omdat de identity provider niet bereikbaar is.
        Probeer het later opnieuw.
      headers:
        Retry-After:
          description: Aantal seconden om te wachten.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probleem'
          example:
            status: 503
            title: Service Unavailable
            detail: Inloggen is tijdelijk niet beschikbaar, probeer het zo opnieuw
    OngeldigVerzoek:
      description: Het verzoek is ongeldig (bijvoorbeeld een verkeerde status of een ongeldig id).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probleem'
          example:
            status: 400
            title: Bad Request
            detail: "status 'KAPOT' is ongeldig (toegestaan: OPEN, IN_BEHANDELING, AFGEROND)"
    NietGevonden:
      description: De werkorder bestaat niet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Probleem'
          example:
            status: 404
            title: Not Found
            detail: Werkorder WO-9999 bestaat niet

  schemas:
    Status:
      type: string
      description: Status van de werkorder. Dezelfde lijst als in het Kafka-berichtcontract.
      enum: [OPEN, IN_BEHANDELING, AFGEROND]

    Prioriteit:
      type: string
      enum: [HOOG, NORMAAL, LAAG]

    Coordinaten:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180

    Locatie:
      type: object
      required: [plaats, spoorEmplacement]
      properties:
        plaats:
          type: string
        spoorEmplacement:
          type: string
        coordinaten:
          $ref: '#/components/schemas/Coordinaten'

    Monteur:
      type: object
      required: [id, naam]
      properties:
        id:
          type: string
          example: M-017
        naam:
          type: string

    Taak:
      type: object
      required: [taakId, omschrijving, gereed]
      properties:
        taakId:
          type: string
          example: T-1
        omschrijving:
          type: string
        gereed:
          type: boolean

    Materiaal:
      type: object
      required: [artikelnr, omschrijving, aantal]
      properties:
        artikelnr:
          type: string
        omschrijving:
          type: string
        aantal:
          type: integer
          minimum: 1

    Werkorder:
      type: object
      required:
        - werkorderId
        - status
        - prioriteit
        - omschrijving
        - locatie
        - aangemaaktOp
        - taken
        - materiaal
      properties:
        werkorderId:
          type: string
          pattern: '^WO-[0-9]+$'
          example: WO-1001
        status:
          $ref: '#/components/schemas/Status'
        prioriteit:
          $ref: '#/components/schemas/Prioriteit'
        omschrijving:
          type: string
        locatie:
          $ref: '#/components/schemas/Locatie'
        monteur:
          allOf:
            - $ref: '#/components/schemas/Monteur'
          nullable: true
          description: Ontbreekt of is null zolang de werkorder niet is toegewezen (alleen bij status OPEN). Via GET /api alleen zichtbaar voor de eigen monteur.
        aangemaaktOp:
          type: string
          format: date-time
        versie:
          type: integer
          minimum: 1
          description: Versie uit de bron; wordt alleen hoger.
        ingetrokken:
          type: boolean
          description: "true als de bron de werkorder heeft ingetrokken. De status is dan AFGEROND (het monteur-model kent geen CANCELLED)."
        redenIntrekking:
          type: string
          nullable: true
        bijgewerktOp:
          type: string
          format: date-time
        taken:
          type: array
          description: Kardinaliteit 0..*. Een lege lijst betekent "geen taken", niet "onbekend".
          items:
            $ref: '#/components/schemas/Taak'
        materiaal:
          type: array
          description: Kardinaliteit 0..*. Een lege lijst betekent "geen materiaal nodig".
          items:
            $ref: '#/components/schemas/Materiaal'

    WerkorderSamenvatting:
      type: object
      required: [werkorderId, status, prioriteit, omschrijving]
      properties:
        werkorderId:
          type: string
          pattern: '^WO-[0-9]+$'
        status:
          $ref: '#/components/schemas/Status'
        prioriteit:
          $ref: '#/components/schemas/Prioriteit'
        omschrijving:
          type: string
        ingetrokken:
          type: boolean

    InternOpslaan:
      type: object
      additionalProperties: false
      required: [messageId, versie]
      properties:
        messageId:
          type: string
          description: messageId van het canonieke bericht (voor traceerbaarheid).
        correlationId:
          type: string
        versie:
          type: integer
          minimum: 1
        ingetrokken:
          type: boolean
          default: false
        reden:
          type: string
          description: Alleen bij een intrekking (DUPLICATE, ERRONEOUS, OBSOLETE, OTHER).
        werkorder:
          description: Verplicht bij aanmaken/wijzigen, verboden bij een intrekking. `werkorderId` moet gelijk zijn aan het pad.
          allOf:
            - $ref: '#/components/schemas/Werkorder'

    InternResultaat:
      type: object
      required: [resultaat, versie]
      properties:
        resultaat:
          type: string
          enum: [VERWERKT, GENEGEERD, TOMBSTONE_BEWAARD]
        versie:
          type: integer
        reden:
          type: string

    WerkorderLijst:
      type: object
      required: [totaal, items]
      properties:
        totaal:
          type: integer
          minimum: 0
          description: Aantal werkorders dat aan het filter voldoet, vóór toepassing van `limit`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/WerkorderSamenvatting'

    Probleem:
      type: object
      description: Vaste foutstructuur (in de stijl van RFC 7807).
      required: [status, title, detail]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
