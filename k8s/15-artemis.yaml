# ActiveMQ Artemis (taakgerichte broker), één node met een eigen schijf voor het journal.
# De broker-configuratie (queue, dead letter address, herlevering) komt uit de ConfigMap artemis-etc-override,
# die deploy.sh maakt uit artemis/etc-override/. Let op: Artemis leest die map alleen bij het AANMAKEN van de instance.
# Na een wijziging van broker.xml dus: StatefulSet en PVC verwijderen (zie artemis/README.md).
# Gebruikers en rollen: de initContainer draait artemis/init-users.sh en zet broker.xml, artemis-users.properties en
# artemis-roles.properties op de schijf (etc-override). Wachtwoorden komen uit Secrets die deploy.sh aanmaakt, nooit uit git:
#   artemis-credentials          beheerder (rol amq)
#   artemis-adapter-credentials  source-adapter (rol eam-source) en target-adapter (rol eam-target)
#   artemis-tls                  servercertificaat (broker.p12), keystore-wachtwoord en CA (ca.pem); de acceptor is alleen TLS
# Met Azure Key Vault (KEYVAULT_NAME bij deploy.sh) vult de Secrets Store CSI-driver de eerste twee, zie 70-secrets-keyvault.yaml.
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: werkorder
  labels:
    app: artemis
    app.kubernetes.io/part-of: werkorder-eda
spec:
  selector:
    app: artemis
  ports:
    - name: amqp          # CORE en AMQP 1.0 op dezelfde poort
      port: 61616
      targetPort: 61616
    - name: console
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: artemis
  namespace: werkorder
  labels:
    app: artemis
    app.kubernetes.io/part-of: werkorder-eda
spec:
  serviceName: artemis
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1001          # de gebruiker "artemis" in de image mag naar de schijf schrijven
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configuratie
          image: alpine:3.20
          command: ["/bin/sh", "/cfg/init-users.sh"]
          # Geheimen komen als bestand (projected volume "geheimen", alleen-lezen) en niet als omgevingsvariabele; zie init-users.sh
          env:
            - { name: SRC, value: /cfg/broker.xml }
            - name: ADMIN_USER
              valueFrom: { secretKeyRef: { name: artemis-credentials, key: user } }
            - { name: ADMIN_PASSWORD_FILE, value: /geheimen/admin-password }
            - name: SOURCE_USER
              valueFrom: { secretKeyRef: { name: artemis-adapter-credentials, key: source-user } }
            - { name: SOURCE_PASSWORD_FILE, value: /geheimen/source-password }
            - name: TARGET_USER
              valueFrom: { secretKeyRef: { name: artemis-adapter-credentials, key: target-user } }
            - { name: TARGET_PASSWORD_FILE, value: /geheimen/target-password }
            - { name: KEYSTORE_PASSWORD_FILE, value: /geheimen/keystore-password }
            - { name: TLS_KEYSTORE, value: /geheimen/broker.p12 }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /inst
            - name: cfg
              mountPath: /cfg
              readOnly: true
            - name: geheimen
              mountPath: /geheimen
              readOnly: true
      containers:
        - name: artemis
          image: apache/artemis:2.57.0
          env:
            # Waardeloze opstartgebruiker van de image; het gebruikersbestand uit etc-override (de initContainer) vervangt hem.
            # De echte wachtwoorden staan niet in de omgeving van de broker. Zie ook docker-compose.yml.
            - { name: ARTEMIS_USER, value: bootstrap }
            - { name: ARTEMIS_PASSWORD, value: bootstrap }
            - name: EXTRA_ARGS
              value: "--http-host 0.0.0.0 --relax-jolokia --java-memory 512M"
          ports:
            - name: amqp
              containerPort: 61616
            - name: console
              containerPort: 8161
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 61616
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 61616
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 61616
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/artemis-instance
      volumes:
        - name: cfg
          configMap:
            name: artemis-etc-override
        - name: geheimen
          projected:
            sources:
              - secret:
                  name: artemis-credentials
                  items: [{ key: password, path: admin-password }]
              - secret:
                  name: artemis-adapter-credentials
                  items: [{ key: source-password, path: source-password }, { key: target-password, path: target-password }]
              - secret:
                  name: artemis-tls
                  items: [{ key: broker.p12, path: broker.p12 }, { key: keystore-password, path: keystore-password }]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
