# nginx-configuratie voor de gateway in Kubernetes.
# Zelfde routes als de configuratie in Docker Compose: /ws (WebSocket), /api/ (REST) en / (de monteur-app).
# De servicenamen (ws-microservice, werkorder-api) worden door Kubernetes DNS opgelost.
worker_processes 1;
pid /tmp/nginx.pid;                    # draait zonder root, dus niet in /var/run

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tijdelijke mappen op een schrijfbare plek (de rest van het bestandssysteem is niet voor ons)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

    upstream websocket_backend {
        server ws-microservice:8080;
    }

    upstream werkorder_backend {
        server werkorder-api:8081;
    }

    server {
        listen 8080;

        root  /usr/share/nginx/html;
        index monteur-app.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /ws {
            limit_req zone=ws_limit burst=20 nodelay;

            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/ {
            proxy_pass http://werkorder_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
