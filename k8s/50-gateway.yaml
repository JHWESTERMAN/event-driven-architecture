# API-gateway (nginx): serveert de monteur-app en stuurt /ws en /api/ door naar de services.
# De configuratie (nginx.conf) en de app (monteur-app.html) komen uit ConfigMaps, die het deploy-script aanmaakt.
# We gebruiken de "unprivileged" nginx-image: draait niet als root en luistert daarom op poort 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: werkorder
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: werkorder-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        checksum/config: GATEWAY_HASH       # nieuwe pod als nginx.conf of de app verandert
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx
        - name: html
          configMap:
            name: gateway-html
---
# Alleen bereikbaar binnen het cluster. Toegang van buiten: kubectl port-forward (zie README)
# of het optionele bestand optioneel-publiek.yaml.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: werkorder
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: werkorder-eda
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
