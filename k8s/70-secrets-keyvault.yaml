# Geheimen uit Azure Key Vault via de Secrets Store CSI-driver. NIET OP EEN CLUSTER GETEST: lees dit als een uitgewerkt ontwerp en
# controleer de stappen tegen de actuele Azure-documentatie voordat je het gebruikt.
#
# Werking: de driver haalt de geheimen met een workload identity (federatie tussen het Kubernetes-serviceaccount en een Azure managed
# identity, geen wachtwoord in het cluster) uit de Key Vault en zet ze als Kubernetes-Secrets met de namen en sleutels die de overige
# manifests al verwachten. Zo veranderen 15-artemis, 42, 43 en 60 niet: ze lezen dezelfde Secrets. Die Secrets bestaan alleen zolang een pod ze
# via de CSI-volume gebruikt, daarom houdt de Deployment secrets-sync de volume vast.
#
# Eenmalig voorbereiden (voorbeeld; namen aanpassen):
#   az aks update -g <rg> -n <cluster> --enable-oidc-issuer --enable-workload-identity
#   az aks enable-addons -g <rg> -n <cluster> --addons azure-keyvault-secrets-provider
#   az identity create -g <rg> -n werkorder-secrets                       # client-id wordt KEYVAULT_CLIENT_ID
#   az keyvault create -g <rg> -n <kluis> --enable-rbac-authorization true
#   az role assignment create --assignee <client-id> --role "Key Vault Secrets User" --scope $(az keyvault show -n <kluis> --query id -o tsv)
#   az identity federated-credential create -g <rg> --identity-name werkorder-secrets --name secrets-sync \
#     --issuer $(az aks show -g <rg> -n <cluster> --query oidcIssuerProfile.issuerUrl -o tsv) \
#     --subject system:serviceaccount:werkorder:secrets-sync --audiences api://AzureADTokenExchange
#   ./k8s/keyvault-vullen.sh <kluis>                                      # ontbrekende geheimen willekeurig aanmaken
# Daarna: KEYVAULT_NAME=<kluis> KEYVAULT_TENANT_ID=<tenant> KEYVAULT_CLIENT_ID=<client-id> ./k8s/deploy.sh <acr>
# deploy.sh vervangt KV_NAME, KV_TENANT en KV_CLIENT_ID hieronder.
#
# Bewust buiten de Key Vault: het TLS-servercertificaat van Artemis (Secret artemis-tls; deploy.sh of cert-manager). Het keystore-wachtwoord
# hoort bij dat bestand en moet dus met het certificaat meebewegen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-sync
  namespace: werkorder
  annotations:
    azure.workload.identity/client-id: KV_CLIENT_ID
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: werkorder-keyvault
  namespace: werkorder
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: KV_CLIENT_ID
    keyvaultName: KV_NAME
    tenantId: KV_TENANT
    objects: |
      array:
        - |
          objectName: artemis-admin-user
          objectType: secret
        - |
          objectName: artemis-admin-password
          objectType: secret
        - |
          objectName: artemis-source-user
          objectType: secret
        - |
          objectName: artemis-source-password
          objectType: secret
        - |
          objectName: artemis-target-user
          objectType: secret
        - |
          objectName: artemis-target-password
          objectType: secret
        - |
          objectName: target-adapter-client-secret
          objectType: secret
        - |
          objectName: keycloak-admin-password
          objectType: secret
  secretObjects:
    - secretName: artemis-credentials
      type: Opaque
      data:
        - { objectName: artemis-admin-user, key: user }
        - { objectName: artemis-admin-password, key: password }
    - secretName: artemis-adapter-credentials
      type: Opaque
      data:
        - { objectName: artemis-source-user, key: source-user }
        - { objectName: artemis-source-password, key: source-password }
        - { objectName: artemis-target-user, key: target-user }
        - { objectName: artemis-target-password, key: target-password }
    - secretName: target-adapter-oidc
      type: Opaque
      data:
        - { objectName: target-adapter-client-secret, key: secret }
    - secretName: keycloak-admin
      type: Opaque
      data:
        - { objectName: keycloak-admin-password, key: password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-sync
  namespace: werkorder
  labels:
    app: secrets-sync
    app.kubernetes.io/part-of: werkorder-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-sync
  template:
    metadata:
      labels:
        app: secrets-sync
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: secrets-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pauze
          image: registry.k8s.io/pause:3.9
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: geheimen, mountPath: /mnt/geheimen, readOnly: true }
      volumes:
        - name: geheimen
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: werkorder-keyvault
